# Miniature BrainGnomes configuration for inspection and onboarding.
# Placeholder paths are intentionally non-runnable. Copy this file, replace
# paths, and enable only stages whose prerequisites are available.
metadata:
  project_name: example_project
  project_directory: "."
  dicom_directory: data_dicoms
  bids_directory: data_bids
  fmriprep_directory: data_fmriprep
  mriqc_directory: data_mriqc
  postproc_directory: data_postproc
  rois_directory: data_rois
  log_directory: logs
  scratch_directory: /path/to/scratch/example_project
  templateflow_home: /path/to/templateflow

compute_environment:
  scheduler: slurm
  flywheel: null
  heudiconv_container: null
  bids_validator: null
  mriqc_container: null
  fmriprep_container: null
  aroma_container: null
  fsl_container: null

flywheel_sync:
  enable: false
bids_conversion:
  enable: false
bids_validation:
  enable: false
mriqc:
  enable: false
fmriprep:
  enable: false
aroma:
  enable: false
postprocess:
  enable: false
extract_rois:
  enable: false
